<div class="task-container">
  <header>
    <h1>המשימות שלי</h1>
    <div class="add-task-form">
      <input type="text" placeholder="מה צריך לעשות?" #newTaskInput>
      <button (click)="addTask(newTaskInput.value); newTaskInput.value=''">הוסף משימה</button>
    </div>
  </header>

  <ul class="task-list">
    @for (task of tasksList; track task.id) {
      <li class="task-item" [class.completed]="task.completed">

        <label class="task-content">
          <input type="checkbox"
                 [checked]="task.completed"
                 (change)="toggleTask(task.id)">
          <span>{{ task.title }}</span>
        </label>

        <button class="delete-btn" (click)="deleteTask(task.id)">🗑️</button>

      </li>
    } @empty {
      <li class="task-item" style="justify-content: center; color: gray;">
        אין משימות כרגע, אפשר לנוח! 😎
      </li>
    }
  </ul>
</div>
